# 發布流水線：推 v* 標籤時執行完整 Release（驗證 → 打包 → 推 NuGet → 發 GitHub Release）
name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NuGet 官方 login action（OIDC），不落地 API key
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Tsinswreng

      - name: Run CsTreeTest release script
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project proj/Tsinswreng.CsTreeTest.Scripts/Tsinswreng.CsTreeTest.Scripts.csproj --configuration Release -- Release

      # 產物留檔（nupkg/snupkg），即使發布後也能取回
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-package-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error